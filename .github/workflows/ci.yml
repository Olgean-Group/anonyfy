# CI anonyfy - phase 02/22
# Matrice Python 3.11 / 3.12 / 3.13 avec ruff check, ruff format --check et pytest
# avec couverture. Un job `package` séparé (sur 3.13, après test) build sdist+wheel
# et valide le contenu des artefacts (twine check + garde-fou check_distribution).
# Déclenché sur push et pull request sur toutes les branches.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Installer uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Synchroniser les dépendances
        run: uv sync --extra dev

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format (ruff format --check)
        run: uv run ruff format --check .

      - name: Tests (pytest + couverture)
        run: uv run pytest --cov=anonyfy --cov-report=term-missing

  package:
    # Build et validation des artefacts une seule fois (sur 3.13, après test).
    # Évite de builder 3x dans la matrice et des dist/ conflictuels.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Installer uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Synchroniser les dépendances
        run: uv sync --extra dev

      - name: Build (sdist + wheel)
        run: uv build

      - name: twine check
        run: uv run twine check dist/*

      - name: Garde-fou distribution
        run: python scripts/check_distribution.py dist/*