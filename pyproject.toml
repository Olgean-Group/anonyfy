[project]
name = "anonyfy"
version = "0.1.0"
description = "Anonyfy - anonymisation réversible par pseudonymisation (FPE + registre de scope)"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "Anonyfy contributors" },
]
keywords = ["anonymization", "pseudonymization", "fpe", "gdpr", "rgpd"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "ff3>=1.0.3",
]

[project.scripts]
anonyfy = "anonyfy.cli:main"

[project.urls]
Homepage = "https://github.com/anonyfy/anonyfy"
Repository = "https://github.com/anonyfy/anonyfy"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anonyfy"]

[tool.hatch.build.targets.sdist]
include = [
    "src/anonyfy",
    "LICENSE",
    "NOTICE",
    "README.md",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Les fichiers Markdown contiennent des blocs de code Python illustratifs dont
# l'alignement des commentaires est intentionnel; on les exclut du formateur.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "synthetic: corpus synthétique de non-régression (D12, round-trip/injectivité, pas rappel)",
]
