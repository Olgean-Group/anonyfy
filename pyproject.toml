[project]
name = "anonyfy"
version = "0.1.2"
description = "Pseudonymisation réversible et déterministe des données personnelles françaises avant envoi à un LLM."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "Anonyfy contributors" },
]
keywords = ["anonymization", "pseudonymization", "fpe", "gdpr", "rgpd"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "ff3>=1.0.3",
]

[project.scripts]
anonyfy = "anonyfy.cli:main"

[project.urls]
Homepage = "https://github.com/Olgean-Group/anonyfy"
Repository = "https://github.com/Olgean-Group/anonyfy"
Issues = "https://github.com/Olgean-Group/anonyfy/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=4",
    "ruff>=0.6",
    "pyyaml>=6",
    "build>=1",
    "twine>=5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Exclusion globale appliquée au wheel ET à la sdist (phase 31/M3): les sources
# CSV en clair des gazetteers (data/raw/) sont inutiles à l'exécution — seuls les
# .csv.gz compressés de data/ sont chargés. Évite un doublon ~1 Mo et l'exposition
# des sources en clair dans la distribution.
[tool.hatch.build]
exclude = [
    "src/anonyfy/detect/gazetteers/data/raw",
]

[tool.hatch.build.targets.wheel]
packages = ["src/anonyfy"]

[tool.hatch.build.targets.sdist]
only-include = [
    "src/anonyfy",
    "LICENSE",
    "NOTICE",
    "README.md",
]
# .gitignore est inclus par hatchling (force_include des fichiers d'exclusion
# VCS) et intentionnellement autorisé dans la sdist (décision D29, standard PyPA).

[tool.ruff]
line-length = 100
target-version = "py311"
# Les fichiers Markdown contiennent des blocs de code Python illustratifs dont
# l'alignement des commentaires est intentionnel; on les exclut du formateur.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "synthetic: corpus synthétique de non-régression (D12, round-trip/injectivité, pas rappel)",
]
